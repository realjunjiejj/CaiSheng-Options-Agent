[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caisheng-options-alpha"
version = "0.1.0"
description = "Autonomous multi-agent options alpha system for Alpaca paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "alpaca-py>=0.30.0",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "mcp>=1.0.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
